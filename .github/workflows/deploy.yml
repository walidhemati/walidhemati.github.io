name: Deploy to GitHub Pages

# Builds the Astro site and deploys it with GitHub Actions.
#
# ORDER MATTERS (the repo currently uses the legacy "Deploy from a branch"
# build, source main /):
#   1. FIRST set Settings → Pages → Build and deployment → Source to
#      "GitHub Actions". The current deployment stays live until the next one.
#   2. THEN push/merge to main, so this workflow builds dist/ and deploys it.
# Doing it the other way round lets the legacy Jekyll build publish the raw
# source tree (no root index.html, README as the homepage, /personal/*.html
# 404s because the redirect stubs live in public/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and upload with Astro
        uses: withastro/action@v6.1.3
        with:
          node-version: 22
          package-manager: npm@10

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
